<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Filtros para profundidad y luz -->
  <defs>
    <radialGradient id="eyeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="30%" stop-color="#00c8ff" />
      <stop offset="100%" stop-color="#006688" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="2" />
      <feComposite in="SourceGraphic" />
    </filter>
  </defs>

  <!-- CUERPO SUPERIOR (BOX) -->
  <g transform="translate(64, 40)">
    <!-- Cuerpo principal con bisel -->
    <path d="M10,10 L118,10 L128,25 L128,110 L118,125 L10,125 L0,110 L0,25 Z" fill="#c8a878" stroke="#1a1208" stroke-width="4" />
    <!-- Línea central de diseño -->
    <line x1="64" y1="110" x2="64" y2="125" stroke="#1a1208" stroke-width="2" opacity="0.6" />
    
    <!-- Tornillos y detalles -->
    <circle cx="10" cy="20" r="2" fill="#1a1208" opacity="0.5" />
    <circle cx="118" cy="20" r="2" fill="#1a1208" opacity="0.5" />
    <circle cx="10" cy="115" r="2" fill="#1a1208" opacity="0.5" />
    <circle cx="118" cy="115" r="2" fill="#1a1208" opacity="0.5" />

    <!-- OJO CENTRAL COMPLEJO -->
    <circle cx="64" cy="65" r="32" fill="#1a1208" />
    <circle cx="64" cy="65" r="28" fill="#fff" stroke="#1a1208" stroke-width="2" /> <!-- Parte blanca/esclerótica -->
    <circle cx="64" cy="65" r="18" fill="url(#eyeGradient)" stroke="#004466" stroke-width="1" /> <!-- Iris -->
    <circle cx="64" cy="65" r="6" fill="#000" /> <!-- Pupila -->
    <circle cx="58" cy="58" r="4" fill="#fff" opacity="0.6" /> <!-- Reflejo -->
  </g>

  <!-- BRAZOS (Simétricos) -->
  <!-- Brazo Izquierdo -->
  <g transform="translate(20, 100)">
    <path d="M44,20 Q10,20 10,60 L25,85" fill="none" stroke="#1a1208" stroke-width="12" stroke-linecap="round" />
    <path d="M44,20 Q10,20 10,60 L25,85" fill="none" stroke="#7a5a3a" stroke-width="8" stroke-linecap="round" />
    <!-- Articulación -->
    <circle cx="44" cy="20" r="10" fill="#1a1208" />
    <circle cx="10" cy="60" r="8" fill="#1a1208" />
    <!-- Pinza -->
    <path d="M20,80 L5,100 M20,85 L35,100" stroke="#1a1208" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Brazo Derecho -->
  <g transform="translate(182, 100)">
    <path d="M10,20 Q44,20 44,60 L29,85" fill="none" stroke="#1a1208" stroke-width="12" stroke-linecap="round" />
    <path d="M10,20 Q44,20 44,60 L29,85" fill="none" stroke="#7a5a3a" stroke-width="8" stroke-linecap="round" />
    <!-- Articulación -->
    <circle cx="10" cy="20" r="10" fill="#1a1208" />
    <circle cx="44" cy="60" r="8" fill="#1a1208" />
    <!-- Pinza -->
    <path d="M34,80 L49,100 M34,85 L19,100" stroke="#1a1208" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- ORUGAS / TREADS -->
  <!-- Izquierda -->
  <g transform="translate(40, 160)">
    <path d="M0,10 L80,10 L80,50 Q40,60 0,50 Z" fill="#1a1a1a" stroke="#1a1208" stroke-width="3" />
    <rect x="5" y="15" width="70" height="4" fill="#333" rx="2" />
    <rect x="5" y="25" width="70" height="4" fill="#333" rx="2" />
    <rect x="5" y="35" width="70" height="4" fill="#333" rx="2" />
  </g>
  
  <!-- Derecha -->
  <g transform="translate(136, 160)">
    <path d="M0,10 L80,10 L80,50 Q40,60 0,50 Z" fill="#1a1a1a" stroke="#1a1208" stroke-width="3" />
    <rect x="5" y="15" width="70" height="4" fill="#333" rx="2" />
    <rect x="5" y="25" width="70" height="4" fill="#333" rx="2" />
    <rect x="5" y="35" width="70" height="4" fill="#333" rx="2" />
  </g>
  
  <!-- Soporte central orugas -->
  <rect x="100" y="165" width="56" height="20" fill="#7a5a3a" stroke="#1a1208" stroke-width="3" />

</svg>
